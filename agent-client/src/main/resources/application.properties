# M10 chassis. CLI chat is a one-shot run, no web server (P2.5 changes this).
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
# The SDK's session-cleanup DELETE at shutdown runs outside a bearer scope and
# trips our fail-closed customizer (correct, harmless); keep it off stdout.
logging.level.io.modelcontextprotocol=error

# The LLM provider lives HERE and in the starter dependency — never in code
# (BUILD-PLAN M10 containment; scripts/check-p2.sh). Default: local Ollama in
# the compose "demo" profile. Zero credentials by construction.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
# Demo model pinned in docs/VERSIONS.md (D-010); pre-pulled by infra/ollama/pull-model.sh.
spring.ai.ollama.chat.options.model=qwen3.5:4b
spring.ai.ollama.chat.options.temperature=0.0
# Never pull at runtime — the model arrives via the pre-pull script only.
spring.ai.ollama.init.pull-model-strategy=never
