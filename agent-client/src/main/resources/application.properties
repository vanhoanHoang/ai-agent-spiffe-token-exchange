# M10 chassis. CLI chat is a one-shot run, no web server (P2.5 changes this).
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
# The SDK's session-cleanup DELETE at shutdown runs outside a bearer scope and
# trips our fail-closed customizer (correct, harmless); keep it off stdout.
logging.level.io.modelcontextprotocol=error

# The LLM provider lives HERE and in the starter dependency — never in code
# (BUILD-PLAN M10 containment; scripts/check-p2.sh). Default: local Ollama in
# the compose "llm-local" profile. Zero credentials by construction.
#
# D-039: provider selection is Spring AI's own switch. Both chat
# autoconfigurations carry @ConditionalOnProperty(spring.ai.model.chat,
# havingValue=<their name>, matchIfMissing=true), so exactly one ChatModel
# exists per value. `ollama` = local, no credential anywhere. `openai` = any
# OpenAI-wire endpoint (Groq for the demo); its key comes from the
# environment only (infra/.env, gitignored) — an EMPTY default, never a value.
spring.ai.model.chat=${LLM_PROVIDER:ollama}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${LLM_API_KEY:}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.0
# Reasoning models (Groq's gpt-oss) return a `reasoning` field that Spring AI
# echoes back as `reasoning_content` on the assistant turn of the tool loop,
# which Groq then rejects (400). Asking the endpoint to keep reasoning out of
# the response fixes the round trip; verified against Groq (D-039 §10).
# Groq-shaped default like the base-url above; set LLM_REASONING_FORMAT for
# another endpoint (or empty to send nothing).
spring.ai.openai.chat.extra-body.reasoning_format=${LLM_REASONING_FORMAT:hidden}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
# Demo model pinned in docs/VERSIONS.md (D-010); pre-pulled by infra/ollama/pull-model.sh.
spring.ai.ollama.chat.options.model=qwen3.5:4b
spring.ai.ollama.chat.options.temperature=0.0
# Never pull at runtime — the model arrives via the pre-pull script only.
spring.ai.ollama.init.pull-model-strategy=never
