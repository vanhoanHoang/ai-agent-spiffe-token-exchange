# P2.5 web mode (profile "web"): browser login for alice + chat page.
spring.main.web-application-type=servlet
server.port=8090

# alice's LOGIN (authorization code + PKCE, public client — no secret exists).
# client-authentication-method=none makes Spring Security use PKCE.
# This is the browser's identity leg only; the agent's own credential remains
# the JWT-SVID and the exchange remains hand-rolled (D-007 standing rule).
spring.security.oauth2.client.provider.keycloak.issuer-uri=${ISSUER:http://keycloak:8080/realms/ai-agents}

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=demo-web
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
# The two task scopes are requested here so the consent screen OFFERS them:
# what alice ticks at login is the ceiling for the whole delegation chain
# (M12/D-032). Without them the two-hop use case is unreachable from a browser
# — the agent could ask for onboard:initiate all day and the AS would refuse,
# because the human never granted it.
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,onboard:initiate,issue:employee-cert

# Same login, additionally requesting the OPTIONAL mcp:audit scope — the P3
# consent toggle: what alice grants decides what the agent may do.
spring.security.oauth2.client.registration.keycloak-audit.provider=keycloak
spring.security.oauth2.client.registration.keycloak-audit.client-id=demo-web
spring.security.oauth2.client.registration.keycloak-audit.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak-audit.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak-audit.scope=openid,profile,mcp:audit
