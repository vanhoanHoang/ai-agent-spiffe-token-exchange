# Pinned per docs/VERSIONS.md. Do not bump tags here — change VERSIONS.md first.
name: spiffe-mcp-lab

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.2
    user: "0:0"                             # image default is non-root; named volume is root-owned (lab-only)
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spire/bootstrap/agent-cacert.pem:/opt/spire/conf/server/agent-cacert.pem:ro
      - ./pki:/opt/spire/pki:ro            # M3: EJBCA-issued intermediate lands here
      - spire-server-data:/opt/spire/data
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      retries: 10
    networks: [lab]

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.2
    # Host sleep past the SVID renewal window makes the agent (correctly)
    # remove its SVID and exit; a fresh start re-attests via the long-lived
    # x509pop bootstrap identity. Auto-restart turns a laptop nap into a
    # ~30s self-heal instead of a dead Workload API.
    restart: unless-stopped
    user: "0:0"                             # needs docker.sock + host pid access for workload attestation (lab-only)
    depends_on:
      spire-server: { condition: service_healthy }
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./pki/ejbca-root.pem:/opt/spire/pki/ejbca-root.pem:ro   # M3 bootstrap trust anchor
      - ./spire/bootstrap/agent.crt.pem:/opt/spire/conf/agent/agent.crt.pem:ro
      - ./spire/bootstrap/agent.key.pem:/opt/spire/conf/agent/agent.key.pem:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # docker workload attestor (M2)
      - spire-agent-data:/opt/spire/data
      - spire-agent-socket:/tmp/spire-agent/public
    pid: "host"                             # VERIFY (M2): needed for docker workload attestation on your engine
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/tmp/spire-agent/public/api.sock"]
      interval: 5s
      retries: 10
    networks: [lab]

  keycloak:
    # M7: built image = pinned 26.6.0 base + workstream B's act-spiffe mapper jar
    build: ../keycloak-spiffe-spi
    command:
      - start-dev
      - --features=spiffe                   # D-001: Profile.Feature.SPIFFE (preview); CLIENT_AUTH_FEDERATED is default-on
      - --truststore-paths=/opt/keycloak/truststores/ejbca-root.pem   # M6: validates the https_web bundle endpoint (D-007)
    volumes:
      - ./pki/ejbca-root.pem:/opt/keycloak/truststores/ejbca-root.pem:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin    # lab only; never reuse
      KC_HEALTH_ENABLED: "true"             # health endpoints on management port 9000 (26.6.0 observability/health.adoc)
      KC_HOSTNAME: http://keycloak:8080     # D-005: stable issuer for host-minted + in-network-validated tokens
    ports: ["8080:8080"]
    healthcheck:
      # In-container probe from 26.6.0 docs/guides/observability/health.adoc:103 (image has no curl)
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      retries: 15
    networks: [lab]

  mcp-server:                               # default profile since M4 (D-003 §3)
    build: ../mcp-server
    labels:
      org.lab.workload: mcp-server          # docker workload attestation selector (M2 registration entry)
    depends_on:
      keycloak: { condition: service_healthy }
      spire-agent: { condition: service_healthy }
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:/tmp/spire-agent/public/api.sock   # read by the Spiffe factories (D-006)
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public:ro
    ports: ["8443:8443"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8443"]
      interval: 5s
      retries: 24
      start_period: 40s                     # X509Source blocks until an SVID is issued
    networks:
      lab:
        aliases: [mcp.ai-agent.id.eviden.internal]         # own hostname — MCP clients resolve well-known against root domain

  # Built for ad-hoc runs by checks/acceptance (docker run ...-agent-client);
  # never started as a long-running service.
  agent-client:
    profiles: [tools]
    build:
      context: ..
      dockerfile: agent-client/Dockerfile
    networks: [lab]

  # ---- profile: demo (M10) ------------------------------------------------
  # Local LLM for the demo track. No credentials exist; no host port is
  # published — only workloads on the lab network can reach it. The model
  # (docs/VERSIONS.md, D-010) is pre-pulled by infra/ollama/pull-model.sh
  # into the named volume; nothing pulls at runtime.
  ollama:
    profiles: [demo]
    image: ollama/ollama:0.32.5              # pinned per docs/VERSIONS.md (D-010)
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12
      start_period: 20s
    networks: [lab]

  # P2.5: the same agent workload, serving the browser login + chat page.
  # Same docker label => same SPIFFE ID (it IS spiffe://ai-agent.id.eviden.internal/agent-client);
  # alice's token lives in the server-side session, the browser gets a cookie.
  agent-web:
    profiles: [demo]
    build:
      context: ..                              # repo root: the image also builds the console (D-024)
      dockerfile: agent-client/Dockerfile
    image: spiffe-mcp-lab-agent-client
    command: ["web"]
    labels:
      org.lab.workload: agent-client
    depends_on:
      keycloak: { condition: service_healthy }
      spire-agent: { condition: service_healthy }
      mcp-server: { condition: service_healthy }
      ollama: { condition: service_healthy }
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:/tmp/spire-agent/public/api.sock
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public:ro
      # The console is baked into the image (D-024). For fast UI iteration,
      # docker-compose.dev.yml mounts a host-built dist over it.
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8090"]
      interval: 5s
      retries: 24
      start_period: 40s
    networks: [lab]

  # ---- profile: pki (M3+) -------------------------------------------------
  ejbca:
    profiles: [pki]
    image: keyfactor/ejbca-ce:9.3.7         # pinned per docs/VERSIONS.md (D-004)
    ports: ["8083:8080", "8444:8443"]       # host 8081 collides with nothing, but keep clear of spire-server's in-net 8081 for sanity
    volumes:
      - ejbca-data:/mnt/persistent
    networks: [lab]

volumes:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  ejbca-data:
  ollama-models:

networks:
  lab:
