# SPIRE server 1.15.2 — config keys per specs/spire/spire_server.md (pinned v1.15.2)
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "ai-agent.id.eviden.internal"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"

    # M6: SPIFFE bundle endpoint (https_web + serving_cert_file profile,
    # specs/spire/spire_server.md federation section). Keycloak is pointed at
    # https://spire-server:8443 OUT OF BAND (setup-spiffe-idp.sh) — the URL is
    # never derived from an SVID. Serves the trust-domain bundle as JWKS with
    # use=jwt-svid/x509-svid keys, spiffe_sequence and spiffe_refresh_hint.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
            refresh_hint = "5m"
            profile "https_web" {
                serving_cert_file {
                    cert_file_path = "/opt/spire/pki/bundle-endpoint.crt.pem"
                    key_file_path = "/opt/spire/pki/bundle-endpoint.key.pem"
                    # doc claims default 1h, but 1.15.2 rejects the empty value
                    # with `time: invalid duration ""` when unset
                    file_sync_interval = "1h"
                }
            }
        }
    }

    ca_subject {
        country = ["VN"]
        organization = ["eviden"]
        common_name = "ai-agent.id.eviden.internal SPIRE CA"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    # Agent node attestation: x509pop against a local bootstrap CA
    # (specs/spire/plugin_server_nodeattestor_x509pop.md). This bootstrap PKI is
    # generated by infra/spire/gen-bootstrap.sh and is NOT the EJBCA hierarchy —
    # the infra/pki contract (M3) is untouched by it.
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/opt/spire/conf/server/agent-cacert.pem"
        }
    }

    # M3: EJBCA-rooted chain per infra/pki/README.md contract. "Joining an
    # existing PKI" mode per specs/spire/plugin_server_upstreamauthority_disk.md:
    # cert_file_path chains to the roots in bundle_file_path.
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/opt/spire/pki/spire-intermediate.pem"
            key_file_path = "/opt/spire/pki/spire-intermediate-key.pem"
            bundle_file_path = "/opt/spire/pki/ejbca-root.pem"
        }
    }
}
