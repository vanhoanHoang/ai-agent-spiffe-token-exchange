# SPIRE agent 1.15.2 — config keys per specs/spire/spire_agent.md (pinned v1.15.2)
agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    trust_domain = "lab.internal"

    # M3 (closes the D-003 obligation): the server chains to the EJBCA root via
    # the disk UpstreamAuthority, so that root is the bootstrap trust anchor.
    trust_bundle_path = "/opt/spire/pki/ejbca-root.pem"
}

plugins {
    # Counterpart of the server x509pop attestor
    # (specs/spire/plugin_agent_nodeattestor_x509pop.md); material from gen-bootstrap.sh.
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/opt/spire/conf/agent/agent.key.pem"
            certificate_path = "/opt/spire/conf/agent/agent.crt.pem"
        }
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    # M2 registration entries select on docker labels
    # (specs/spire/plugin_agent_workloadattestor_docker.md; default
    # docker_socket_path unix:///var/run/docker.sock).
    WorkloadAttestor "docker" {
        plugin_data {
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
        }
    }
}
