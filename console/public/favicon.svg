<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Identity Console">
  <!-- Two interlocking links: one delegation hop handing to the next. Palette
       is the v2 system (D-037) — ink ground, paper for the human-side link,
       bridge orange for the link the exchange adds. Legible down to 16px. -->
  <rect width="32" height="32" rx="7" fill="#171c26" />
  <circle cx="12.5" cy="16" r="6.4" fill="none" stroke="#dde2ea" stroke-width="3" />
  <circle cx="19.5" cy="16" r="6.4" fill="none" stroke="#c2551f" stroke-width="3" />
  <!-- Redrawn over the orange so the links read as interlocked, not overlapping. -->
  <path d="M17.1,11.4 A6.4,6.4 0 0 1 17.1,20.6" fill="none" stroke="#dde2ea" stroke-width="3" stroke-linecap="round" />
</svg>
