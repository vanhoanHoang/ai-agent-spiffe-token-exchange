<header class="topbar">
  <a class="brand" routerLink="/">Identity Console</a>
  <span class="env">spiffe://lab.internal</span>
  <span class="spacer"></span>
  @if (session.user(); as u) {
    <span class="who">{{ u.username }}</span>
    <span class="scopes">{{ u.scopes.join(' ') }}</span>
    <button type="button" class="logout" (click)="logout()">Log out</button>
  }
</header>
<router-outlet />
