<svg viewBox="0 0 1260 560" role="img"
  aria-label="sequence: alice, agent-client, SPIRE Server, Keycloak, MCP server, agent-pki, cert-service, Eviden Root CA">
  <defs>
    <marker id="ah-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-human" />
    </marker>
    <marker id="ah-work" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-workload" />
    </marker>
    <marker id="ah-bridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-bridge" />
    </marker>
  </defs>

  <!-- Lifelines: one per actor, time flows down. Messages are horizontal, so
       no two arrows can ever cross — the old node-graph's hairball is gone. -->
  <line x1="80" y1="60" x2="80" y2="470" class="lifeline" />
  <line x1="250" y1="76" x2="250" y2="470" class="lifeline" />
  <line x1="420" y1="60" x2="420" y2="476" class="lifeline" />
  <line x1="590" y1="60" x2="590" y2="470" class="lifeline" />
  <line x1="790" y1="60" x2="790" y2="470" class="lifeline" />
  <line x1="990" y1="76" x2="990" y2="470" class="lifeline" />
  <line x1="1175" y1="60" x2="1175" y2="470" class="lifeline" />

  <!-- Messages, top to bottom in story order. -->
  <path id="p-chat" d="M86,110 L244,110" class="edge human" [class.on]="on('chat')" marker-end="url(#ah-human)" />
  <path id="p-login" d="M86,148 L584,148" class="edge human" [class.on]="on('login')" marker-end="url(#ah-human)" />
  <path id="p-svid" d="M414,186 L256,186" class="edge workload" [class.on]="on('svid')" marker-end="url(#ah-work)" />
  <path id="p-exch" d="M256,224 L584,224" class="edge bridge" [class.on]="on('exch')" marker-end="url(#ah-bridge)" />
  <path id="p-call" d="M256,262 L784,262" class="edge workload" [class.on]="on('call')" marker-end="url(#ah-work)" />
  <path id="p-hand" d="M256,300 L984,300" class="edge workload" [class.on]="on('hand')" marker-end="url(#ah-work)" />
  <path id="p-svid2" d="M414,338 L984,338" class="edge workload" [class.on]="on('svid2')" marker-end="url(#ah-work)" />
  <path id="p-exch2" d="M984,376 L596,376" class="edge bridge" [class.on]="on('exch2')" marker-end="url(#ah-bridge)" />
  <path id="p-issue" d="M996,414 L1169,414" class="edge workload" [class.on]="on('issue')" marker-end="url(#ah-work)" />
  <path id="p-pki" d="M420,498 L420,478" class="edge workload" [class.on]="on('pki')" marker-end="url(#ah-work)" />

  <!-- The refused path is DRAWN, always: agent-client may never reach
       cert-service. An edge nobody can see proves nothing to an audience. -->
  <path id="p-forbid" d="M256,452 L1169,452" class="edge forbidden" [class.on]="on('forbidden')" />
  <circle cx="712" cy="452" r="10" class="xbg" />
  <text x="712" y="456.5" text-anchor="middle" class="xmark">✗</text>
  <text x="730" y="445" class="lbl deny" [class.on]="on('forbidden')">direct issuance · never permitted</text>

  <circle r="5" class="packet human" [class.on]="on('chat')"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p-chat" /></animateMotion></circle>
  <circle r="5" class="packet human" [class.on]="on('login')"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p-login" /></animateMotion></circle>
  <circle r="5" class="packet workload" [class.on]="on('svid')"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p-svid" /></animateMotion></circle>
  <circle r="6" class="packet bridge" [class.on]="on('exch')"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p-exch" /></animateMotion></circle>
  <circle r="6" class="packet workload" [class.on]="on('call')"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-call" /></animateMotion></circle>
  <circle r="6" class="packet workload" [class.on]="on('hand')"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#p-hand" /></animateMotion></circle>
  <circle r="5" class="packet workload" [class.on]="on('svid2')"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p-svid2" /></animateMotion></circle>
  <circle r="6" class="packet bridge" [class.on]="on('exch2')"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p-exch2" /></animateMotion></circle>
  <circle r="6" class="packet workload" [class.on]="on('issue')"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#p-issue" /></animateMotion></circle>
  <circle r="5" class="packet workload" [class.on]="on('pki')"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-pki" /></animateMotion></circle>

  <!-- Labels: mono, 1–3 words, above their own line. Nothing overlaps. -->
  <text x="96" y="103" class="lbl" [class.on]="on('chat')">prompt</text>
  <text x="96" y="141" class="lbl" [class.on]="on('login')">OIDC login + consent</text>
  <text x="268" y="179" class="lbl" [class.on]="on('svid')">X.509 + JWT-SVID</text>
  <text x="268" y="217" class="lbl bridge" [class.on]="on('exch')">hop 1 · RFC 8693 · act.sub = agent-client</text>
  <text x="268" y="255" class="lbl" [class.on]="on('call')">mTLS + exchanged token</text>
  <text x="268" y="293" class="lbl" [class.on]="on('hand')">mTLS · onboard_employee</text>
  <text x="426" y="331" class="lbl" [class.on]="on('svid2')">its own SVID</text>
  <text x="978" y="369" text-anchor="end" class="lbl bridge" [class.on]="on('exch2')">hop 2 · RFC 8693 · act nested</text>
  <text x="1160" y="407" text-anchor="end" class="lbl" [class.on]="on('issue')">mTLS · issue_employee_cert</text>
  <text x="432" y="492" class="lbl" [class.on]="on('pki')">signs the intermediate</text>

  <!-- Actors. The 3px top bar carries the identity colour. -->
  <g class="node human">
    <rect x="15" y="14" width="130" height="46" rx="6" class="card" />
    <rect x="15" y="14" width="130" height="3" class="topbar" />
    <text x="80" y="43" text-anchor="middle" class="name">alice</text>
  </g>
  <g class="node workload">
    <rect x="175" y="14" width="150" height="62" rx="6" class="card" />
    <rect x="175" y="14" width="150" height="3" class="topbar" />
    <text x="250" y="37" text-anchor="middle" class="name">agent-client</text>
    <rect x="190" y="44" width="120" height="17" rx="4" class="scope-pill" />
    <text x="250" y="56" text-anchor="middle" class="scope-text">{{ assistantScope() }}</text>
  </g>
  <g class="node workload">
    <rect x="345" y="14" width="150" height="46" rx="6" class="card" />
    <rect x="345" y="14" width="150" height="3" class="topbar" />
    <text x="420" y="43" text-anchor="middle" class="name">SPIRE Server</text>
  </g>
  <g class="node human">
    <rect x="515" y="14" width="150" height="46" rx="6" class="card" />
    <rect x="515" y="14" width="150" height="3" class="topbar" />
    <text x="590" y="43" text-anchor="middle" class="name">Keycloak</text>
  </g>
  <g class="node workload" [class.dim]="dim('mcp')">
    <rect x="710" y="14" width="160" height="46" rx="6" class="card" />
    <rect x="710" y="14" width="160" height="3" class="topbar" />
    <text x="790" y="43" text-anchor="middle" class="name">MCP server</text>
  </g>
  <g class="node workload" [class.dim]="dim('pki')">
    <rect x="910" y="14" width="160" height="62" rx="6" class="card" />
    <rect x="910" y="14" width="160" height="3" class="topbar" />
    <text x="990" y="37" text-anchor="middle" class="name">agent-pki</text>
    <rect x="920" y="44" width="140" height="17" rx="4" class="scope-pill" />
    <text x="990" y="56" text-anchor="middle" class="scope-text">issue:employee-cert</text>
  </g>
  <g class="node workload" [class.dim]="dim('pki')">
    <rect x="1100" y="14" width="150" height="46" rx="6" class="card" />
    <rect x="1100" y="14" width="150" height="3" class="topbar" />
    <text x="1175" y="43" text-anchor="middle" class="name">cert-service</text>
  </g>
  <g class="node workload dashed">
    <rect x="345" y="500" width="150" height="44" rx="6" class="card" />
    <text x="420" y="527" text-anchor="middle" class="name">Eviden Root CA</text>
  </g>
</svg>
