<svg viewBox="0 0 1440 820" role="img"
  aria-label="architecture: alice, Keycloak, agent-client, agent-pki, cert-service, MCP server, SPIRE, Eviden Root CA">
  <defs>
    <marker id="ah-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-human" />
    </marker>
    <marker id="ah-work" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-workload" />
    </marker>
    <marker id="ah-bridge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-bridge" />
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="fill-ink" />
    </marker>
  </defs>

  <!-- Edges. Lanes are reserved so nothing crosses except one deliberate X
       between the hop-2 exchange and the MCP call — two paths that belong to
       different stories and are never lit at the same time. -->
  <path id="p-login" d="M222,266 C310,250 372,80 537,62" class="edge human" [class.on]="on('login')" marker-end="url(#ah-human)" />
  <path id="p-chat" d="M222,306 L362,306" class="edge human" [class.on]="on('chat')" marker-end="url(#ah-human)" />
  <path id="p-exch" d="M470,246 C470,186 536,110 610,110" class="edge bridge" [class.on]="on('exch')" marker-end="url(#ah-bridge)" />
  <path id="p-call" d="M624,282 L1112,272" class="edge ink" [class.on]="on('call')" marker-end="url(#ah-ink)" />
  <path id="p-hand" d="M450,358 L450,444" class="edge ink" [class.on]="on('hand')" marker-end="url(#ah-ink)" />
  <path id="p-exch2" d="M604,448 C664,404 664,196 728,124" class="edge bridge" [class.on]="on('exch2')" marker-end="url(#ah-bridge)" />
  <path id="p-issue" d="M624,504 L1112,504" class="edge ink" [class.on]="on('issue')" marker-end="url(#ah-ink)" />
  <path id="p-svid" d="M170,556 C170,470 300,400 420,360" class="edge workload" [class.on]="on('svid')" marker-end="url(#ah-work)" />
  <path id="p-svid2" d="M304,598 C340,592 348,532 362,516" class="edge workload" [class.on]="on('svid2')" marker-end="url(#ah-work)" />
  <path id="p-pki" d="M180,672 L180,646" class="edge workload" [class.on]="on('pki')" marker-end="url(#ah-work)" />

  <!-- The refused path runs the outside margin: out of agent-client's left
       edge just under alice, down the far-left lane, along the bottom, up the
       far-right lane into cert-service. It crosses nothing. -->
  <path id="p-forbid" d="M368,348 L28,348 L28,770 L1360,770 L1360,558" class="edge forbidden" [class.on]="on('forbidden')" />

  <circle r="7" class="packet human" [class.on]="on('login')"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p-login" /></animateMotion></circle>
  <circle r="7" class="packet human" [class.on]="on('chat')"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p-chat" /></animateMotion></circle>
  <circle r="8" class="packet bridge" [class.on]="on('exch')"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p-exch" /></animateMotion></circle>
  <circle r="8" class="packet ink" [class.on]="on('call')"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-call" /></animateMotion></circle>
  <circle r="8" class="packet ink" [class.on]="on('hand')"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#p-hand" /></animateMotion></circle>
  <circle r="8" class="packet bridge" [class.on]="on('exch2')"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p-exch2" /></animateMotion></circle>
  <circle r="8" class="packet ink" [class.on]="on('issue')"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#p-issue" /></animateMotion></circle>
  <circle r="7" class="packet workload" [class.on]="on('svid')"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p-svid" /></animateMotion></circle>
  <circle r="7" class="packet workload" [class.on]="on('svid2')"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p-svid2" /></animateMotion></circle>
  <circle r="7" class="packet workload" [class.on]="on('pki')"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-pki" /></animateMotion></circle>

  <!-- Labels. Each sits in a reserved gap; none overlaps a node or another label. -->
  <text x="330" y="122" text-anchor="middle" font-size="18" class="lbl" [class.on]="on('login')">OIDC login + consent</text>
  <text x="330" y="146" text-anchor="middle" font-size="16" class="lbl sub" [class.on]="on('login')">alice's grant bounds the whole chain</text>
  <text x="292" y="296" text-anchor="middle" font-size="18" class="lbl" [class.on]="on('chat')">prompt</text>
  <text x="664" y="172" font-size="18" class="lbl" [class.on]="on('exch')">hop 1 · RFC 8693</text>
  <text x="664" y="196" font-size="16" class="lbl sub" [class.on]="on('exch')">act.sub = agent-client</text>
  <text x="868" y="256" text-anchor="middle" font-size="18" class="lbl" [class.on]="on('call')">mTLS + exchanged token</text>
  <text x="430" y="406" text-anchor="end" font-size="18" class="lbl" [class.on]="on('hand')">mTLS · onboard_employee</text>
  <text x="836" y="402" font-size="18" class="lbl" [class.on]="on('exch2')">hop 2 · RFC 8693</text>
  <text x="836" y="426" font-size="16" class="lbl sub" [class.on]="on('exch2')">act nests · agent-pki ▸ agent-client</text>
  <text x="868" y="486" text-anchor="middle" font-size="18" class="lbl" [class.on]="on('issue')">mTLS · issue_employee_cert</text>
  <text x="215" y="470" text-anchor="middle" font-size="17" class="lbl" [class.on]="on('svid')">X.509 + JWT-SVID</text>
  <text x="330" y="584" font-size="16" class="lbl sub" [class.on]="on('svid2')">its own SVID</text>
  <text x="324" y="702" font-size="17" class="lbl" [class.on]="on('pki')">signs the intermediate</text>
  <text x="694" y="800" text-anchor="middle" font-size="17" class="forbidden-lbl">never permitted — the assistant cannot issue certificates</text>

  <circle cx="694" cy="770" r="18" class="xbg" />
  <text x="694" y="779" text-anchor="middle" class="xmark">✗</text>

  <g class="node human">
    <rect x="40" y="250" width="182" height="88" rx="4" />
    <text x="58" y="282" class="kicker">HUMAN</text>
    <text x="58" y="314" class="name">alice</text>
  </g>
  <g class="node human">
    <rect x="545" y="24" width="310" height="86" rx="4" />
    <text x="563" y="56" class="kicker">AUTHORIZATION SERVER</text>
    <text x="563" y="90" class="name">Keycloak</text>
  </g>
  <g class="node workload">
    <rect x="368" y="250" width="256" height="104" rx="4" />
    <text x="386" y="280" class="kicker">AI ASSISTANT · HOLDS THE LLM</text>
    <text x="386" y="312" class="name">agent-client</text>
    <rect x="386" y="320" width="188" height="26" rx="3" class="scope-pill" />
    <text x="396" y="339" class="scope-text">{{ assistantScope() }}</text>
  </g>
  <g class="node ink" [class.dim]="dim('mcp')">
    <rect x="1112" y="232" width="278" height="88" rx="4" />
    <text x="1130" y="264" class="kicker">RESOURCE</text>
    <text x="1130" y="296" class="name">MCP server</text>
  </g>
  <g class="node workload" [class.dim]="dim('pki')">
    <rect x="368" y="452" width="256" height="104" rx="4" />
    <text x="386" y="482" class="kicker">PKI AGENT · HOLDS NO MODEL</text>
    <text x="386" y="514" class="name">agent-pki</text>
    <rect x="386" y="522" width="218" height="26" rx="3" class="scope-pill" />
    <text x="396" y="541" class="scope-text">issue:employee-cert</text>
  </g>
  <g class="node ink" [class.dim]="dim('pki')">
    <rect x="1112" y="452" width="278" height="96" rx="4" />
    <text x="1130" y="484" class="kicker">RESOURCE · ISSUES VIA EJBCA</text>
    <text x="1130" y="516" class="name">cert-service</text>
  </g>
  <g class="node workload">
    <rect x="60" y="560" width="240" height="82" rx="4" />
    <text x="78" y="590" class="kicker">ATTESTATION · INTERMEDIATE CA</text>
    <text x="78" y="622" class="name">SPIRE Server</text>
  </g>
  <g class="node workload dashed">
    <rect x="60" y="676" width="240" height="78" rx="4" />
    <text x="78" y="706" class="kicker">PKI · TRUST ANCHOR</text>
    <text x="78" y="736" class="name">Eviden Root CA</text>
  </g>
</svg>
