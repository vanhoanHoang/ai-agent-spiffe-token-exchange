@if (leaf(); as l) {
  <dc-cert-card
    [kicker]="kicker()"
    [lead]="lead()"
    [cert]="l"
    [chain]="svid().chain"
    [reloadable]="true"
    (reload)="reload.emit()"
  />
}
@if (jwt(); as t) {
  <dc-token-card [token]="t" role="workload" kicker="JWT-SVID · workload only" [title]="svid().spiffeId" />
}
