<header>
  <div class="inner">
    <h1>Two identities, one call</h1>
    <div class="chips">
      <div class="chip">
        <span class="dot workload"></span>
        <span class="chip-value">{{ run().trust_domain }}</span>
      </div>
      <div class="chip">
        <span class="dot human"></span>
        <span class="chip-value">{{ issuer() }}</span>
      </div>
      <div class="chip">
        <span class="dot ink"></span>
        <span class="chip-value">{{ run().actors.mcp_server.resource_id }}</span>
      </div>
    </div>
  </div>
</header>
